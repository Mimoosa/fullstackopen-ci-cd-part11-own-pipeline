name: deployment_pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  install_dependencies_and_check_style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install root dependencies
        run: npm install
      - name: Install frontend dependencies
        run: npm --prefix frontend install
      - name: Check style
        run: npm run eslint
  build_and_backend_tests_and_playwright_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install backend dependencies
        run: npm install
      - name: Install frontend dependencies
        run: npm --prefix frontend install
      - name: build frontend
        run: npm run build:frontend
      - name: run backend tests
        env:
          NODE_ENV: test
          TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
          SECRET: ${{ secrets.SECRET }}
          PORT: 3003
        run: npm test
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: run playwright tests
        env:
          NODE_ENV: test
          TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
          SECRET: ${{ secrets.SECRET }}
          PORT: 3003
        run: npm run test:e2e
  deploy:
    needs:
      - install_dependencies_and_check_style
      - build_and_backend_tests_and_playwright_tests
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '#skip') }}
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}
  notify_success:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Notify success
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '#skip') && success() }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          content: 'Deployment Successful! A new version deployed to production'
          title: 'Deployment Details'
          description: |
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
            Author: ${{ github.event.head_commit.author.name }}
          username: Fullstack part 11 Hook
  tag_release:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Bump version and push tag
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '#skip') }}
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
  notify_failure:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Notify failure
        if: ${{ needs.deploy.result == 'failure' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          content: 'Build Failed! The pipeline encoutered an error'
          title: 'Failure Details'
          description: |
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
            Author: ${{ github.event.head_commit.author.name }}
            Workflow: ${{ github.workflow }}
            Job: ${{ github.job }}
          username: Fullstack part 11 Hook
          color: 0xff0000
